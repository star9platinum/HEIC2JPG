name: Public tree check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject binaries, archives, and media
        shell: powershell
        run: .\scripts\check-public-tree.ps1

  macos-logic-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke-test native macOS sips
        run: |
          set -eu
          work=$(mktemp -d "${TMPDIR:-/tmp}/HEIC2JPG-sips.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | /usr/bin/base64 -D > "$work/input.png"
          /usr/bin/sips -s format jpeg -s formatOptions 90 "$work/input.png" \
            --out "$work/output.jpg" > "$work/sips.log" 2>&1 || {
              sed 's/^/  /' "$work/sips.log" >&2
              exit 1
            }
          test -s "$work/output.jpg"
          /usr/bin/sips -g format "$work/output.jpg" | grep -Eiq 'format:[[:space:]]*jpeg'
      - name: Validate multi-folder AppleScript syntax
        run: |
          set -eu
          work=$(mktemp -d "${TMPDIR:-/tmp}/HEIC2JPG-picker.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          /usr/bin/osacompile -o "$work/folder-picker.scpt" <<'APPLESCRIPT'
          use scripting additions
          try
            set selectedFolders to choose folder with prompt "选择一个或多个包含 HEIC 照片的根文件夹" with multiple selections allowed
            set outputLines to ""
            repeat with selectedFolder in selectedFolders
              set outputLines to outputLines & (POSIX path of selectedFolder) & linefeed
            end repeat
            return outputLines
          on error number -128
            return ""
          end try
          APPLESCRIPT
      - name: Test folder selection and deletion safety flow
        run: bash tests/macos/run-tests.sh
